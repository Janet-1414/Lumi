name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

defaults:
  run:
    working-directory: backend

jobs:
  # ── Lint + Type Check ───────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: MyPy type check
        run: uv run mypy app/

  # ── Tests + Coverage ────────────────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB:       lumi_test
          POSTGRES_USER:     lumi_test
          POSTGRES_PASSWORD: lumi_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install all dependencies (including dev)
        run: uv sync

      - name: Run Alembic migrations on test DB
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://lumi_test:lumi_test_password@localhost:5432/lumi_test

      - name: Run tests with coverage
        run: >
          uv run pytest
            --cov=app
            --cov-report=term-missing
            --cov-report=xml:coverage.xml
            --cov-fail-under=90
            -v
        env:
          DATABASE_URL:    postgresql+asyncpg://lumi_test:lumi_test_password@localhost:5432/lumi_test
          APP_ENV:         test
          JWT_SECRET_KEY:  ci-test-secret-key-not-for-production
          OPENAI_API_KEY:  test-key-mocked-in-tests
          COOKIE_SECURE:   "false"
          CORS_ORIGINS:    "http://localhost:3000"
          LANGCHAIN_TRACING_V2: "false"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: backend/coverage.xml
          flags: backend

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ── Build Docker image (verify it builds) ──────────────────────────────────
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build -f Dockerfile -t lumi-backend:${{ github.sha }} .

  # ── Deploy to Railway ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service lumi-backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for deployment and health check
        run: |
          echo "Waiting for deployment to be healthy..."
          sleep 30
          curl --fail --retry 5 --retry-delay 10 \
            "${{ secrets.RAILWAY_BACKEND_URL }}/health" || exit 1

      - name: Notify on failure
        if: failure()
        run: echo "Backend deployment failed — check Railway dashboard"
